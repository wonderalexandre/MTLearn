name: Sync public main into private

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [sync-private]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-promotion-and-synchronization
  cancel-in-progress: false

jobs:
  synchronize:
    if: >-
      github.repository == 'wonderalexandre/MTLearn' &&
      vars.PROMOTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Create repository token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.PROMOTION_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROMOTION_APP_PRIVATE_KEY }}
          owner: wonderalexandre
          repositories: |
            MTLearn
            MTLearn-dev
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Check out trusted automation
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Reconcile public history
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python .github/scripts/repository_promotion.py sync
