<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" role="img" aria-labelledby="title desc">
  <title id="title">CFP class architecture</title>
  <desc id="desc">Class relationship diagram for ConnectedFilterPreprocessingLayer and mtlearn.layers.cfp extension components.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155" />
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
    <style>
      .canvas { fill: #ffffff; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.3; rx: 10; }
      .layer { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.6; rx: 8; }
      .core { fill: #ecfdf5; stroke: #059669; stroke-width: 1.3; rx: 7; }
      .ext { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.3; rx: 7; }
      .support { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.3; rx: 7; }
      .subtle { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.2; rx: 6; }
      .title { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .section { font: 700 14px Arial, sans-serif; fill: #334155; }
      .label { font: 600 13px Arial, sans-serif; fill: #0f172a; }
      .small { font: 12px Arial, sans-serif; fill: #334155; }
      .tiny { font: 11px Arial, sans-serif; fill: #475569; }
      .arrow { fill: none; stroke: #334155; stroke-width: 1.4; marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #64748b; stroke-width: 1.3; stroke-dasharray: 6 5; marker-end: url(#arrow-dashed); }
      .calls { fill: none; stroke: #0f766e; stroke-width: 1.3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="1180" height="760" />
  <text class="title" x="590" y="32" text-anchor="middle">Connected Filter Preprocessing architecture</text>

  <rect class="layer" x="370" y="55" width="440" height="86" />
  <text class="label" x="590" y="84" text-anchor="middle">ConnectedFilterPreprocessingLayer</text>
  <text class="small" x="590" y="106" text-anchor="middle">public API, compatibility wrappers, module state</text>
  <text class="tiny" x="590" y="124" text-anchor="middle">owns specs and delegates execution, persistence, inspection</text>

  <rect class="panel" x="30" y="165" width="315" height="310" />
  <text class="section" x="188" y="191" text-anchor="middle">Configuration and registries</text>

  <rect class="support" x="58" y="215" width="260" height="54" />
  <text class="label" x="188" y="238" text-anchor="middle">SpecRegistry</text>
  <text class="tiny" x="188" y="256" text-anchor="middle">maps config kind strings to factories</text>

  <rect class="support" x="58" y="289" width="260" height="86" />
  <text class="label" x="188" y="313" text-anchor="middle">component_registries.py</text>
  <text class="tiny" x="188" y="333" text-anchor="middle">SCORING_MODEL_REGISTRY</text>
  <text class="tiny" x="188" y="350" text-anchor="middle">SCORE_CONSTRAINT_REGISTRY</text>
  <text class="tiny" x="188" y="367" text-anchor="middle">REGULARIZER_REGISTRY</text>

  <rect class="support" x="58" y="395" width="260" height="54" />
  <text class="label" x="188" y="418" text-anchor="middle">ConfigSerializer / ConfigDeserializer</text>
  <text class="tiny" x="188" y="436" text-anchor="middle">configs, contracts, from_config inputs</text>

  <rect class="panel" x="385" y="165" width="390" height="310" />
  <text class="section" x="580" y="191" text-anchor="middle">Runtime execution</text>

  <rect class="core" x="415" y="215" width="330" height="48" />
  <text class="label" x="580" y="244" text-anchor="middle">ForwardExecutor</text>

  <rect class="core" x="415" y="283" width="155" height="54" />
  <text class="label" x="492" y="306" text-anchor="middle">TreePayloadProvider</text>
  <text class="tiny" x="492" y="324" text-anchor="middle">tree info, attributes</text>

  <rect class="core" x="590" y="283" width="155" height="54" />
  <text class="label" x="667" y="306" text-anchor="middle">TreePayloadCache</text>
  <text class="tiny" x="667" y="324" text-anchor="middle">sample/tree payloads</text>

  <rect class="core" x="415" y="357" width="155" height="54" />
  <text class="label" x="492" y="380" text-anchor="middle">AttributeNormalizer</text>
  <text class="tiny" x="492" y="398" text-anchor="middle">dataset and local stats</text>

  <rect class="core" x="590" y="357" width="155" height="54" />
  <text class="label" x="667" y="380" text-anchor="middle">TreeReconstructionFunction</text>
  <text class="tiny" x="667" y="398" text-anchor="middle">node signal to pixels</text>

  <rect class="core" x="475" y="430" width="210" height="32" />
  <text class="small" x="580" y="451" text-anchor="middle">BatchInputNormalizer</text>

  <rect class="panel" x="820" y="165" width="330" height="470" />
  <text class="section" x="985" y="191" text-anchor="middle">Filter spec composition</text>

  <rect class="ext" x="850" y="215" width="270" height="52" />
  <text class="label" x="985" y="238" text-anchor="middle">NormalizedFilterSpec</text>
  <text class="tiny" x="985" y="256" text-anchor="middle">validated per-output definition</text>

  <rect class="ext" x="850" y="287" width="270" height="62" />
  <text class="label" x="985" y="310" text-anchor="middle">ScoringModel</text>
  <text class="tiny" x="985" y="328" text-anchor="middle">LinearSigmoidScorer, MLPScorer</text>
  <text class="tiny" x="985" y="344" text-anchor="middle">custom scorers</text>

  <rect class="ext" x="850" y="369" width="270" height="62" />
  <text class="label" x="985" y="392" text-anchor="middle">Altitude Residues</text>
  <text class="tiny" x="985" y="410" text-anchor="middle">fixed morphology signal</text>
  <text class="tiny" x="985" y="426" text-anchor="middle">not a Python extension point</text>

  <rect class="ext" x="850" y="451" width="270" height="54" />
  <text class="label" x="985" y="474" text-anchor="middle">ScoreConstraint</text>
  <text class="tiny" x="985" y="492" text-anchor="middle">PreserveRootConstraint, custom constraints</text>

  <rect class="ext" x="850" y="525" width="270" height="54" />
  <text class="label" x="985" y="548" text-anchor="middle">Regularizer</text>
  <text class="tiny" x="985" y="566" text-anchor="middle">EdgeScoreMonotonicityRegularizer, custom penalties</text>

  <rect class="panel" x="385" y="520" width="390" height="150" />
  <text class="section" x="580" y="546" text-anchor="middle">Persistence and analysis helpers</text>

  <rect class="subtle" x="415" y="570" width="150" height="54" />
  <text class="label" x="490" y="593" text-anchor="middle">PersistentStateManager</text>
  <text class="tiny" x="490" y="611" text-anchor="middle">stats, extra state, params</text>

  <rect class="subtle" x="595" y="570" width="150" height="54" />
  <text class="label" x="670" y="593" text-anchor="middle">TrainingSampleInspector</text>
  <text class="tiny" x="670" y="611" text-anchor="middle">notebook inspection payloads</text>

  <rect class="subtle" x="490" y="640" width="180" height="24" />
  <text class="tiny" x="580" y="656" text-anchor="middle">StatsSerializer</text>

  <rect class="subtle" x="45" y="520" width="300" height="150" />
  <text class="section" x="195" y="546" text-anchor="middle">Legend</text>
  <line class="arrow" x1="75" y1="575" x2="140" y2="575" />
  <text class="tiny" x="155" y="579">owns or delegates to</text>
  <line class="dashed" x1="75" y1="607" x2="140" y2="607" />
  <text class="tiny" x="155" y="611">creates from config</text>
  <line class="calls" x1="75" y1="639" x2="140" y2="639" />
  <text class="tiny" x="155" y="643">runtime call path</text>

  <path class="arrow" d="M 470 141 C 380 150 310 168 245 215" />
  <path class="arrow" d="M 590 141 L 590 215" />
  <path class="arrow" d="M 710 141 C 800 150 885 172 950 215" />
  <path class="arrow" d="M 590 141 C 590 285 580 425 580 520" />

  <path class="dashed" d="M 318 242 C 520 230 660 220 850 240" />
  <path class="dashed" d="M 318 332 C 530 345 670 360 850 400" />
  <path class="dashed" d="M 318 422 C 505 510 675 555 850 552" />

  <path class="calls" d="M 580 263 L 492 283" />
  <path class="calls" d="M 580 263 L 667 283" />
  <path class="calls" d="M 492 337 L 492 357" />
  <path class="calls" d="M 667 337 L 667 357" />
  <path class="calls" d="M 745 239 C 790 240 815 240 850 240" />
  <path class="calls" d="M 745 310 C 790 315 815 318 850 318" />
  <path class="calls" d="M 745 384 C 790 396 815 400 850 400" />
  <path class="calls" d="M 745 384 C 790 460 815 478 850 478" />

  <path class="arrow" d="M 985 267 L 985 287" />
  <path class="arrow" d="M 985 267 L 985 369" />
  <path class="arrow" d="M 985 267 L 985 451" />
  <path class="arrow" d="M 985 267 L 985 525" />
</svg>
